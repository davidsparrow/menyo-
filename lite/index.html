<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>menyo lite</title>
    <meta
      name="description"
      content="Turn a menu into an ordering page. Guests order on an iPad, the order is emailed or texted to the restaurant."
    />
    <meta name="theme-color" content="#c2410c" />
    <meta name="color-scheme" content="light dark" />

    <!-- Home-screen install on iPadOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Order" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="manifest.webmanifest" />

    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div id="app"></div>
    <div id="cartbar" class="cartbar" aria-live="polite"></div>
    <div id="toasts" class="toast-host" role="status" aria-live="polite"></div>

    <noscript>
      <div style="max-width: 640px; margin: 48px auto; padding: 0 20px; font-family: -apple-system, sans-serif">
        <h1>JavaScript is switched off</h1>
        <p>This ordering page needs JavaScript. Turn it on in Settings → Safari, then reload.</p>
      </div>
    </noscript>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
